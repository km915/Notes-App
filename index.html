<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Notes</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--pn:#111a2e;--tx:#d8dee9;--dm:#7b88a1;--ac:#88c0d0;--se:#1c2a47;--gl:color-mix(in srgb,var(--ac) 35%,transparent)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;overscroll-behavior:none}
body{height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;background:var(--pn);padding:2px 4px}
#t{flex:1;color:var(--tx);font-weight:600;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button{background:none;border:0;color:var(--ac);font:inherit;min-width:44px;height:44px;cursor:pointer}
#bk{display:none}
main{flex:1;display:grid;grid-template-columns:var(--w0,180px) var(--w1,280px) minmax(0,1fr);min-height:0;position:relative}
.p{display:flex;flex-direction:column;overflow:auto;border-right:1px solid var(--se);min-height:0}
.i{padding:10px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.i.s{background:var(--se)}
.p.on .i.s{color:var(--ac);box-shadow:inset 3px 0 var(--ac)}
.h{color:var(--dm);cursor:default}
#E{user-select:text;-webkit-user-select:text;flex:1;width:100%;background:none;color:inherit;border:0;outline:0;resize:none;padding:14px;font:inherit}
#ch{display:none;overflow-x:auto;white-space:nowrap;background:var(--pn);border-top:1px solid var(--se);padding:6px 8px;scrollbar-width:none}
#ch span{display:inline-block;padding:4px 12px;margin-right:6px;border-radius:14px;background:var(--bg);color:var(--dm)}
#ch .s{background:var(--se);color:var(--ac)}
.g{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;cursor:col-resize;z-index:2;touch-action:none}
.g:first-of-type{left:var(--w0,180px)}
.g:nth-of-type(2){left:calc(var(--w0,180px) + var(--w1,280px))}
.g:hover,.g:active{background:var(--se)}
button,.i,#ch span{transition:box-shadow .15s,text-shadow .15s}
@media(hover:hover){
 .i:not(.h):hover{box-shadow:inset 0 0 14px var(--gl)}
 .p.on .i.s:hover{box-shadow:inset 3px 0 var(--ac),inset 0 0 14px var(--gl)}
 button:hover{text-shadow:0 0 8px var(--ac)}
 #ch span:hover{box-shadow:0 0 8px var(--gl)}
}
#o,#o2{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
#o[hidden],#o2[hidden]{display:none}
#o>div,#o2>div{background:var(--pn);width:min(420px,92vw);border-radius:8px;overflow:hidden}
#q{width:100%;padding:14px;background:none;border:0;border-bottom:1px solid var(--se);color:inherit;font:inherit;outline:0}
#o b{display:inline-block;min-width:8.5em;color:var(--dm);font-weight:400}
input{user-select:text;-webkit-user-select:text}
#ls{max-height:60vh;overflow:auto}
#V{display:none;overflow:auto;padding:10px;min-height:0;background:var(--bg);color:var(--tx);--gl:color-mix(in srgb,var(--ac) 35%,transparent)}
.hd{padding:10px 14px 2px;color:var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.i.td{font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
#ch .td{color:var(--ac);font-weight:700}
#V.f{box-shadow:inset 0 2px 0 var(--ac)}
main.c{grid-template-columns:minmax(0,1fr)}
main.c .p,main.c .g,main.sl .g,main.sr .g{display:none}
main.c #V{display:block}
.tb{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.tb b{flex:1;text-align:center}
.tb button{min-width:36px;height:36px;border-radius:6px}
.tb .s{background:var(--se)}
.wk,.mg,.wg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk b{color:var(--dm);font-weight:400;text-align:center;font-size:13px}
.mg{gap:2px;grid-auto-rows:minmax(76px,1fr)}
.dc{background:var(--pn);padding:4px;overflow:hidden;border-radius:6px;cursor:pointer}
.dc span{color:var(--dm);font-size:13px}
.dc.o{opacity:.45}
.dc.td span{color:var(--ac);font-weight:700}
.dc i{display:block;font-style:normal;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--se);border-radius:3px;margin-top:2px;padding:0 4px}
.dc.s,.wc.s{box-shadow:inset 0 0 0 2px var(--ac)}
.wg{gap:4px}
.wc{background:var(--pn);border-radius:6px;padding:6px;min-height:200px;cursor:pointer;min-width:0}
.wc h4{color:var(--dm);font-size:13px;font-weight:400;margin-bottom:4px}
.tk{padding:8px 12px;border-radius:6px;background:var(--pn);margin-bottom:6px;cursor:pointer}
.wc .tk{padding:3px 6px;font-size:13px;background:var(--se);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.s{box-shadow:inset 3px 0 var(--ac);background:var(--se)}
.tk b{color:var(--ac);font-weight:600;margin-right:8px}
.dn,.dn b{text-decoration:line-through;opacity:.5}
#nv{display:none;background:var(--pn);border-top:1px solid var(--se)}
#nv button{flex:1}
#nv .s{color:var(--tx);background:var(--se)}
#o2>div{padding:14px;display:grid;gap:8px;max-height:86vh;overflow:auto}
#o2 input{background:var(--bg);color:inherit;border:1px solid var(--se);border-radius:6px;padding:8px;font:inherit;min-width:0}
#o2 .r{display:flex;gap:6px;align-items:center}
#o2 .r span{color:var(--dm)}
#o2 .r input[type=checkbox]{width:18px;height:18px}
#o2 .bt{background:none;border:1px solid var(--se);color:var(--dm);padding:0 2px;height:38px;min-width:0}
#o2 .bt.on{color:var(--ac);border-color:var(--ac);box-shadow:0 0 10px var(--gl)}
#o2 button{background:var(--se);border-radius:6px;flex:1}
@media(hover:hover){.dc:hover,.tk:hover,.wc:hover{box-shadow:inset 0 0 14px var(--gl)}}
@media(min-width:701px){
 main.sl{grid-template-columns:minmax(0,1.4fr) 110px 200px minmax(0,1fr)}
 main.sr{grid-template-columns:110px 200px minmax(0,1fr) minmax(0,1.4fr)}
 main.sl #V,main.sr #V{display:block}
 main.sl #V{order:-1}
}
@media(max-width:700px){
 .wg{grid-template-columns:1fr}
 .wc{min-height:0}
 .mg{grid-auto-rows:minmax(60px,1fr)}
 main.c #V{height:100%}
 #nv{display:flex}
}
@media(max-width:700px){
 main{display:block}
 .p{display:none;height:100%;border:0}
 .p.on{display:flex}
 #bk{display:block}
 #ch.v{display:block}
 .g{display:none}
}
</style>
</head>
<body>
<header>
 <button id="bk">‹</button><span id="t"></span>
 <button id="st"></button><button id="ad">+</button><button id="up">▲</button><button id="dn">▼</button><button id="mn">⋯</button>
</header>
<nav id="ch"></nav>
<main>
 <i class="g" data-c="0"></i><i class="g" data-c="1"></i>
 <div class="p" id="P0"></div>
 <div class="p" id="P1"></div>
 <div class="p" id="P2"><textarea id="E" placeholder="Write…"></textarea></div>
 <div id="V"></div>
</main>
<footer id="nv"><button data-m="n">Notes</button><button data-m="c">Calendar</button></footer>
<div id="o" hidden><div><input id="q" autocomplete="off" autocapitalize="off"><div id="ls"></div></div></div>
<div id="o2" hidden><div></div></div>

<script>
// ---- CONFIG: paste your Google OAuth Client ID here ----
const CID='58518608488-05qgos3pv2n23l76617aou61f46ihdlf.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.file';

// ---- THEMES: [name, notes colours, calendar colours], each [bg,panel,text,dim,accent,selected] — add more here ----
const TH=[
 ['Midnight',['#0b1220','#111a2e','#d8dee9','#7b88a1','#88c0d0','#1c2a47'],['#12203a','#1a2b4d','#e6ecf5','#8fa0bd','#8fd0e6','#26406b']],
 ['Gruvbox',['#2b2118','#342920','#ebdbb2','#a89984','#fabd2f','#4a3a2a'],['#3a2c1e','#46362a','#f2e5c0','#b8a78c','#ffc83d','#5c4733']],
 ['Forest',['#0d1a14','#12241b','#d5e5da','#7f9a8a','#7fd1a0','#1d3a2b'],['#15291f','#1c3a2c','#e2f1e7','#8fb09b','#8fe3b0','#2a5a41']],
 ['Dusk',['#150f1f','#1d1530','#e3dcf0','#8f84a8','#c3a6ff','#2d2150'],['#1f1630','#2a1f45','#efe8fb','#a094bd','#d2b8ff','#3d2d6b']]
];

// ---- DATA: {f:[folders],n:[notes]}; item = {id,o:order,t:edited,x:deleted,...} ----
const $=s=>document.querySelector(s),L=localStorage,E=$('#E'),Q=$('#q'),O=$('#o'),LS=$('#ls');
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const dt=s=>new Date(s+'T00:00');
const addD=(s,n)=>{const x=dt(s);x.setDate(x.getDate()+n);return iso(x)};
const addM=(s,n)=>{const x=dt(s),k=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(k,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return iso(x)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D=JSON.parse(L.d||'{"f":[],"n":[]}'),fi=0,ni=0,pane=0,shown,ov,tok=L.tk,tm,busy,again,hl=history.state&&history.state.p||0;
if(!D.f.length)D.f.push({id:'d',name:'Notes',o:1,t:1});
D.t=D.t||[];
if(!D.f.some(f=>f.id=='todo'))D.f.push({id:'todo',name:'To-Do',o:0,t:1}); // always-first folder for task notes
let mode='n',sd='r',cf=0,cv='m',cd=iso(new Date()),ti=0,tab; // mode: n notes, c calendar, s split (calendar on side sd, cf = calendar has focus)
const cal=()=>mode=='c'||mode=='s'&&cf;
const live=a=>a.filter(x=>!x.x).sort((a,b)=>a.o-b.o);
const F=()=>live(D.f).sort((a,b)=>(b.id=='todo')-(a.id=='todo')),N=()=>F()[fi]?live(D.n.filter(n=>n.f==F()[fi].id&&(n.f!='todo'||vis(n)))):[];
const cur=()=>pane?N()[ni]:F()[fi];
const save=()=>{L.d=JSON.stringify(D);clearTimeout(tm);tm=setTimeout(sync,2000)};
const add=(a,o)=>{const x={id:uid(),o:Date.now(),t:Date.now(),...o};a.push(x);save();return x};

// ---- UI ----
function draw(){
 if(!F().length)add(D.f,{name:'Notes'});
 const f=F(),n=N();
 fi=Math.max(0,Math.min(fi,f.length-1));ni=Math.max(0,Math.min(ni,N().length-1));
 const row=(a,k,s)=>a.map((x,i)=>`<div class="i${i==s?' s':''}${!k&&x.id=='todo'?' td':''}" data-k="${k}" data-i="${i}">${esc(k?(x.b.split('\n')[0]||'Empty note'):x.name)}</div>`).join('');
 $('#P0').innerHTML=row(f,0,fi);
 $('#P1').innerHTML=n.length?row(n,1,ni):'<div class="i h">Tap + (or press n) for a new note</div>';
 [0,1,2].forEach(i=>$('#P'+i).classList.toggle('on',i==pane));
 const x=N()[ni];
 if(!x)E.value='';else if(shown!=x.id||document.activeElement!=E)E.value=x.b;
 shown=x&&x.id;E.disabled=!x;
 $('#t').textContent=mode=='c'?'Calendar':pane?f[fi].name:'Folders';
 const cs=pane==1?f.map(x=>x.name):pane==2?n.map(x=>x.b.split('\n')[0]||'Empty'):[],ci=pane==1?fi:ni;
 $('#ch').className=pane?'v':'';
 $('#ch').innerHTML=cs.map((x,i)=>`<span class="${i==ci?'s ':''}${pane==1&&f[i].id=='todo'?'td':''}" data-i="${i}">${esc(x.length>9?x.slice(0,9)+'…':x)}</span>`).join('');
 const sc=$('#ch .s');sc&&sc.scrollIntoView({inline:'center',block:'nearest'});
 if(!ov)pane==2&&!cal()?E.focus():E.blur();
 $('main').className=mode=='n'?'n':mode=='c'?'c':'s'+sd;
 document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('s',b.dataset.m==(mode=='c'?'c':'n')));
 applyTh();
 if(mode!='n')drawC();
 // keep phone back button working: one history entry per level
 if(pane>hl){history.pushState({p:pane},'');hl=pane}else if(pane<hl){const k=hl-pane;hl=pane;history.go(-k)}
}
function leave(){const x=N()[ni];if(pane==2&&x&&!x.b.trim()){x.x=1;x.t=Date.now();save()}}
function back(){if(cal()){cv=cv=='d'?'w':'m';return drawC()}leave();pane=Math.max(0,pane-1);draw()}
function move(d){
 const a=pane?N():F(),i=pane?ni:fi,b=a[i+d];if(!b||a[i].id=='todo'||b.id=='todo')return;
 [a[i].o,b.o]=[b.o,a[i].o];a[i].t=b.t=Date.now();
 pane?ni+=d:fi+=d;save();draw();
}
function newNote(){const f=F()[fi];add(D.n,{f:f.id,b:''});ni=N().length-1;pane=2;draw()}
function newFolder(){ask('Folder name',v=>{add(D.f,{name:v});fi=F().length-1;ni=0;pane=1;draw()})}
function rename(){const f=F()[fi];if(f.id=='todo')return;ask('Rename folder',v=>{f.name=v;f.t=Date.now();save();draw()},f.name)}
function del(){
 const x=cur();if(!x||x.id=='todo')return;
 ask('Delete? type y',v=>{
  if(v!='y')return;
  x.x=1;x.t=Date.now();
  if(!pane)D.n.forEach(n=>{if(n.f==x.id){n.x=1;n.t=x.t}});
  pane?ni--:fi--;pane=pane?1:0;save();draw();
 });
}
const VN=['bg','pn','tx','dm','ac','se'];
function applyTh(){ // calendar has its own (brighter) palette
 const t=TH[+L.th||0],c=mode=='c'?t[2]:t[1];
 c.forEach((x,j)=>document.documentElement.style.setProperty('--'+VN[j],x));
 t[2].forEach((x,j)=>$('#V').style.setProperty('--'+VN[j],x));
 $('[name=theme-color]').content=c[0];
}
function setTh(i){L.th=(i+TH.length)%TH.length;applyTh()}

// ---- COMMANDS: [key, label, action]. Menu (Esc) lists these. ----
const C=[ // [key, label, action, scope: n=notes, c=calendar, none=general]
 ['Esc','Show / hide this list',()=>0],
 ['s','Sync / connect Drive',()=>{L.link=1;sync()}],
 ['Tab+Enter','Switch Notes / Calendar (closes a split view)',swap],
 ['Tab+Left','Split view, calendar on left / move focus left',()=>split('l')],
 ['Tab+Right','Split view, calendar on right / move focus right',()=>split('r')],
 ...TH.map((t,i)=>['','Theme: '+t[0],()=>setTh(i)]),
 ['Up / Down','Move through folders / notes',()=>0,'n'],
 ['Right / Enter','Open folder / note',()=>0,'n'],
 ['Left','Go back',()=>0,'n'],
 ['n','New note',newNote,'n'],
 ['f','New folder',newFolder,'n'],
 ['r','Rename folder',rename,'n'],
 ['d','Delete selected',del,'n'],
 ['Alt+Up','Move up in order',()=>move(-1),'n'],
 ['Alt+Down','Move down in order',()=>move(1),'n'],
 ['t','Next theme',()=>setTh((+L.th||0)+1),'n'],
 ['Left / Right','Previous / next day',()=>0,'c'],
 ['Up / Down','Week up / down (pick task in day view)',()=>0,'c'],
 ['[ and ]','Previous / next month, week or day',()=>0,'c'],
 ['Enter','Open day / edit task',()=>0,'c'],
 ['n','New task',newTask,'c'],
 ['e','Edit task',editTask,'c'],
 ['o','Task details (opens its note)',()=>{const x=curT();x&&openNote(x)},'c'],
 ['x','Done / not done',toggleDone,'c'],
 ['Delete','Delete task',delTask,'c'],
 ['Alt+Up','Shift task 15 min earlier',()=>shift(-1),'c'],
 ['Alt+Down','Shift task 15 min later',()=>shift(1),'c'],
 ['m','Month view',()=>setV('m'),'c'],
 ['w','Week view',()=>setV('w'),'c'],
 ['d','Day view',()=>setV('d'),'c'],
 ['t','Jump to today',()=>{cd=iso(new Date());ti=0;drawC()},'c']
];
// ---- Popup: menu (Esc) and text prompts ----
const order=()=>mode=='c'||mode=='s'&&sd=='l'?['','c','n']:['','n','c']; // general first, then the section on the left
const items=()=>{const q=Q.value.toLowerCase(),o=order();return C.filter(c=>c[1].toLowerCase().includes(q)).sort((a,b)=>o.indexOf(a[3]||'')-o.indexOf(b[3]||''))};
function run(c){const k=c[3];if(k){if(mode=='s')cf=k=='c';else mode=k=='c'?'c':'n'}c[2]();draw()}
function ml(){
 let g;const H={'':'General',n:'Notes',c:'Calendar'};
 LS.innerHTML=items().map((c,i)=>{const k=c[3]||'',h=k!=g?(g=k,`<div class="hd">${H[k]}</div>`):'';return h+`<div class="i${i==ov.i?' s':''}" data-c="${i}"><b>${c[0]}</b>${c[1]}</div>`}).join('');
 const e=LS.querySelector('.s');e&&e.scrollIntoView({block:'nearest'});
}
function ask(label,fn,v=''){ov={fn};Q.placeholder=label;Q.value=v;LS.innerHTML='';O.hidden=0;Q.focus()}
function menu(){ov={m:1,i:0};Q.placeholder='Command…';Q.value='';O.hidden=0;Q.focus();ml()}
function close(){ov=null;O.hidden=1;Q.blur()}
Q.onkeydown=ev=>{
 const k=ev.key,n=items().length;
 if(k=='Escape')return close();
 if(k=='Enter'){ev.preventDefault();const m=ov,v=Q.value.trim(),c=items()[m.i];close();return m.fn?v&&m.fn(v):c&&run(c)}
 if(!ov.fn&&n&&(k=='ArrowDown'||k=='ArrowUp')){ev.preventDefault();ov.i=(ov.i+(k=='ArrowDown'?1:-1)+n)%n;ml()}
};
Q.oninput=()=>{if(ov.m){ov.i=0;ml()}};
LS.onclick=ev=>{const el=ev.target.closest('[data-c]');if(el){const c=items()[+el.dataset.c];close();run(c)}};
O.onclick=ev=>{if(ev.target==O)close()};

// ---- Keyboard: Esc = menu. Editing: Esc = back to lists. ----
onkeydown=ev=>{
 const k=ev.key;
 if(ov||ev.target==Q)return;
 if(k=='Tab'){ev.preventDefault();tab=1;return}
 if(tab){ev.preventDefault();if(!ev.repeat){if(k=='Enter')swap();if(k=='ArrowLeft')split('l');if(k=='ArrowRight')split('r')}return}
 if(cal())return calKey(ev);
 if(ev.target==E){if(k=='Escape'){ev.preventDefault();leave();pane=1;draw()}return}
 if(ev.ctrlKey||ev.metaKey)return;
 if(k=='Escape'||k=='?'){ev.preventDefault();return menu()}
 if(ev.altKey){ev.preventDefault();if(k=='ArrowUp')move(-1);if(k=='ArrowDown')move(1);return}
 const d={ArrowDown:1,j:1,ArrowUp:-1,k:-1}[k];
 if(d){ev.preventDefault();pane?ni+=d:(fi+=d,ni=0);return draw()}
 if(k=='ArrowRight'||k=='l'||k=='Enter'){ev.preventDefault();pane=Math.min(pane+1,2);if(pane==2&&!N()[ni])pane=1;return draw()}
 if(k=='ArrowLeft'||k=='h'){ev.preventDefault();return back()}
 const c=C.find(c=>c[0]==k&&c[3]!='c');if(c){ev.preventDefault();c[2]()}
};
E.oninput=()=>{const x=N()[ni];x.b=E.value;x.t=Date.now();save();draw()};
$('main').onclick=ev=>{
 const w=cf;cf=!!ev.target.closest('#V');if(w!=cf&&mode=='s')draw();
 const el=ev.target.closest('[data-i]');if(!el)return;
 const k=+el.dataset.k,i=+el.dataset.i;
 k?ni=i:(fi=i,ni=0);pane=k+1;draw();
};
$('#ch').onclick=ev=>{
 const el=ev.target.closest('[data-i]');if(!el)return;
 const i=+el.dataset.i;
 if(pane==1){fi=i;ni=0}else{const x=N()[i];leave();ni=N().indexOf(x)}
 draw();
};
onpopstate=()=>{const p=history.state&&history.state.p||0;hl=p;if(p<pane){leave();pane=p;draw()}};
$('#bk').onclick=back;$('#mn').onclick=menu;
$('#ad').onclick=()=>cal()?newTask():pane?newNote():newFolder();
$('#up').onclick=()=>cal()?shift(-1):move(-1);$('#dn').onclick=()=>cal()?shift(1):move(1);
$('#st').onclick=()=>{L.link=1;sync()};
// drag the dividers to resize the columns (saved per device)
document.querySelectorAll('.g').forEach(g=>g.onpointerdown=ev=>{
 const k='--w'+g.dataset.c,x0=ev.clientX,w0=$('#P'+g.dataset.c).offsetWidth;
 g.setPointerCapture(ev.pointerId);
 g.onpointermove=m=>{const w=Math.max(100,Math.min(600,w0+m.clientX-x0));document.documentElement.style.setProperty(k,w+'px');L[k]=w};
 g.onpointerup=()=>g.onpointermove=null;
});
['--w0','--w1'].forEach(k=>L[k]&&document.documentElement.style.setProperty(k,L[k]+'px'));

// ---- Calendar & tasks. One record per day: {id,d:'YYYY-MM-DD',s:'HH:MM',e,b:title,z:done,g:series id} ----
const days='Mon Tue Wed Thu Fri Sat Sun'.split(' ');
const TD=s=>D.t.filter(x=>!x.x&&x.d==s).sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);
const curT=()=>TD(cd)[ti];
function drawC(){
 const td=iso(new Date()),T=TD(cd),M=dt(cd),wd=(M.getDay()+6)%7;
 ti=Math.max(0,Math.min(ti,T.length-1));
 const ttl=cv=='m'?M.toLocaleDateString(undefined,{month:'long',year:'numeric'}):cv=='w'?'Week of '+dt(addD(cd,-wd)).toLocaleDateString(undefined,{day:'numeric',month:'short'}):M.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
 let h=`<div class="tb"><button data-a="-1">‹</button><b>${ttl}</b><button data-a="1">›</button>${[...'mwd'].map(v=>`<button data-v="${v}"${v==cv?' class="s"':''}>${v.toUpperCase()}</button>`).join('')}</div>`;
 if(cv=='m'){
  const st=addD(cd.slice(0,8)+'01',-((new Date(M.getFullYear(),M.getMonth(),1).getDay()+6)%7));
  h+='<div class="wk">'+days.map(x=>`<b>${x}</b>`).join('')+'</div><div class="mg">';
  for(let i=0;i<42;i++){
   const s=addD(st,i),a=TD(s);
   h+=`<div class="dc${s==cd?' s':''}${s==td?' td':''}${s.slice(0,7)!=cd.slice(0,7)?' o':''}" data-d="${s}"><span>${+s.slice(8)}</span>${a.slice(0,3).map(x=>`<i${x.z?' class="dn"':''}>${esc(x.b)}</i>`).join('')}${a.length>3?`<i>+${a.length-3}</i>`:''}</div>`;
  }
  h+='</div>';
 }else if(cv=='w'){
  h+='<div class="wg">'+days.map((n,i)=>{const s=addD(cd,i-wd);return `<div class="wc${s==cd?' s':''}" data-d="${s}"><h4>${n} ${+s.slice(8)}</h4>${TD(s).map((x,j)=>`<div class="tk${x.z?' dn':''}${s==cd&&j==ti?' s':''}" data-t="${x.id}">${x.s} ${esc(x.b)}</div>`).join('')}</div>`}).join('')+'</div>';
 }else h+=T.length?T.map((x,j)=>`<div class="tk${x.z?' dn':''}${j==ti?' s':''}" data-t="${x.id}"><b>${x.s}–${x.e}</b>${esc(x.b)}</div>`).join(''):'<div class="h" style="padding:12px">No tasks. Press n to add one.</div>';
 $('#V').innerHTML=h;$('#V').classList.toggle('f',mode=='s'&&cf);
}
const go=(n,big)=>{cd=big&&cv=='m'?addM(cd,n):addD(cd,big&&cv=='w'?7*n:n);ti=0;drawC()};
const setV=v=>{cv=v;drawC()};
function shift(d){
 const x=curT();if(!x||cv!='d')return;
 const m=h=>+h.slice(0,2)*60+ +h.slice(3),f=n=>String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
 const a=m(x.s),b=m(x.e),k=Math.max(-a,Math.min(1439-b,d*15));
 x.s=f(a+k);x.e=f(b+k);x.t=Date.now();save();ti=TD(cd).indexOf(x);drawC();
}
function toggleDone(){const x=curT();if(x){x.z=x.z?0:1;x.t=Date.now();save();drawC()}}
function delTask(){const x=curT();if(x)ask('Delete task? type y',v=>{if(v=='y'){x.x=1;x.t=Date.now();save();draw()}})}
function newTask(){taskForm()}
function editTask(){const x=curT();x?taskForm(x):newTask()}
const O2=$('#o2'),closeF=()=>{ov=null;O2.hidden=1;draw()};
const now=()=>{const d=new Date();return iso(d)+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
// a task's note lives in the To-Do folder; it shows there while the task is upcoming, or when the calendar is open on its date
function vis(n){return !n.k||D.t.some(x=>(x.g||x.id)==n.k&&(!x.x&&!x.z&&x.d+x.e>now()||mode!='n'&&x.d==cd))}
function ensureNote(x){const k=x.g||x.id;return D.n.find(n=>n.k==k&&!n.x)||add(D.n,{f:'todo',k,b:x.b+'\n'})}
function openNote(x){
 const n=ensureNote(x);cd=x.d;mode='s';cf=0;fi=0;pane=2;ni=Math.max(0,N().indexOf(n));draw();
 E.setSelectionRange(E.value.length,E.value.length);
}
function taskForm(t){
 ov={form:1};
 $('#o2>div').innerHTML=`<input id="fb" placeholder="Task" value="${t?esc(t.b):''}">
 <div class="r"><input id="fd" type="date" value="${t?t.d:cd}"><input id="fs" type="time" value="${t?t.s:'09:00'}"><input id="fe" type="time" value="${t?t.e:'10:00'}"></div>
 <button class="bt" id="fr">Repeats?</button>
 <div id="rp" hidden><div class="r">${days.map((n,i)=>`<button class="bt" data-w="${i}">${n}</button>`).join('')}</div>
  <div class="r" style="margin-top:8px"><span>Repeat for</span><input id="fw" type="number" min="1" max="52" value="1" style="width:70px"><span>weeks</span></div></div>
 <div class="r"><button id="fx">Cancel</button><button id="fm">Details</button><button id="fk">Save</button></div>`;
 const B=[...document.querySelectorAll('#rp [data-w]')];
 B[(dt(t?t.d:cd).getDay()+6)%7].classList.add('on');
 B.forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 $('#fr').onclick=()=>{$('#fr').classList.toggle('on');$('#rp').hidden=!$('#fr').classList.contains('on')};
 $('#fx').onclick=closeF;$('#fk').onclick=()=>saveTask(t);$('#fm').onclick=()=>saveTask(t,1);
 O2.hidden=0;$('#fb').focus();
}
function saveTask(t,det){
 const b=$('#fb').value.trim(),d=$('#fd').value,s=$('#fs').value||'09:00',e=$('#fe').value||s;
 if(!b||!d)return $('#fb').focus();
 const W=$('#fr').classList.contains('on')?[...document.querySelectorAll('#rp .on')].map(x=>+x.dataset.w):[];
 let g=W.length?uid():0,first;
 if(t){
  const nt=!t.g&&D.n.find(n=>n.k==t.id&&!n.x); // keep note heading = task heading
  if(nt&&t.b!=b){const i=nt.b.indexOf('\n');nt.b=b+(i<0?'':nt.b.slice(i));nt.t=Date.now()}
  if(g){const n=D.n.find(n=>n.k==(t.g||t.id)&&!n.x);t.g=t.g||g;g=t.g;if(n){n.k=g;n.t=Date.now()}}
  Object.assign(t,{b,d,s,e,t:Date.now()});first=t;
 }else if(!g)first=add(D.t,{b,d,s,e});
 if(g){
  const end=addD(d,7*Math.max(1,Math.min(52,+$('#fw').value||1))-1);
  for(let x=d;x<=end;x=addD(x,1)){
   if(!W.includes((dt(x).getDay()+6)%7)||t&&x==d)continue;
   const y=add(D.t,{b,g,d:x,s,e});first=first||y;
  }
 }
 save();cd=first.d;ti=Math.max(0,TD(cd).indexOf(first));ov=null;O2.hidden=1;
 det?openNote(first):draw();
}
O2.onkeydown=ev=>{if(ev.key=='Escape')closeF();else if(ev.key=='Enter'){ev.preventDefault();$('#fk').click()}};
O2.onclick=ev=>{if(ev.target==O2)closeF()};
function calKey(ev){
 const k=ev.key=='Backspace'?'Delete':ev.key;
 if(k=='Escape'||k=='?'){ev.preventDefault();return menu()}
 if(ev.ctrlKey||ev.metaKey)return;
 if(ev.altKey&&(k=='ArrowUp'||k=='ArrowDown')){ev.preventDefault();return shift(k=='ArrowUp'?-1:1)}
 if(k=='ArrowLeft'||k=='ArrowRight'){ev.preventDefault();return go(k=='ArrowLeft'?-1:1)}
 if(k=='ArrowUp'||k=='ArrowDown'){ev.preventDefault();const u=k=='ArrowUp'?-1:1;return cv=='d'?(ti+=u,drawC()):go(7*u)}
 if(k=='['||k==']'){ev.preventDefault();return go(k=='['?-1:1,1)}
 if(k=='Enter'){ev.preventDefault();return cv=='d'?editTask():setV('d')}
 const c=C.find(c=>c[0]==k&&c[3]!='n');if(c){ev.preventDefault();c[2]()}
}
function setMode(m){leave();mode=m;draw()}
function swap(){if(mode=='s'){mode=cf?'c':'n';draw()}else setMode(mode=='n'?'c':'n')}
function split(s){if(mode=='s'){cf=sd==s;draw()}else{leave();cf=mode=='n';mode='s';sd=s;draw()}}
$('#V').onclick=ev=>{
 cf=1;
 const b=ev.target.closest('[data-a],[data-v],[data-t],[data-d]');if(!b)return draw();
 const a=b.dataset;
 if(a.a)go(+a.a,1);
 else if(a.v)setV(a.v);
 else if(a.t){const x=D.t.find(y=>y.id==a.t);cd=x.d;ti=TD(cd).indexOf(x);drawC()}
 else{const same=cd==a.d;cd=a.d;ti=0;if(cv!='d'&&(same||matchMedia('(hover:none)').matches))cv='d';drawC()}
};
$('#V').ondblclick=ev=>ev.target.closest('[data-t]')?editTask():ev.target.closest('.dc,.wc')&&newTask();
let sx;$('#V').ontouchstart=e=>sx=e.touches[0].clientX;
$('#V').ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)go(d<0?1:-1,1)};
document.querySelectorAll('#nv button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
addEventListener('keyup',ev=>{if(ev.key=='Tab')tab=0});
addEventListener('blur',()=>tab=0);

// ---- Google Drive sync (one file: notes.json) ----
const setSt=s=>$('#st').textContent=s; // ○ local only/offline  ◐ syncing  ● synced  ! tap to reconnect
const gis=()=>window.google&&google.accounts?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=no;document.head.append(s)});
const login=()=>new Promise(async(ok,no)=>{
 await gis();
 google.accounts.oauth2.initTokenClient({client_id:CID,scope:SCOPE,error_callback:no,callback:r=>{
  if(!r.access_token)return no(r);
  tok=L.tk=r.access_token;L.exp=Date.now()+r.expires_in*1e3-6e4;ok();
 }}).requestAccessToken();
});
const api=(u,o={})=>fetch('https://www.googleapis.com/'+u,{...o,headers:{Authorization:'Bearer '+tok,...o.headers}}).then(r=>{if(!r.ok)throw r.status;return r});
function merge(a,b){ // newest edit per item wins
 for(const k of['f','n','t']){
  a[k]=a[k]||[];
  const m=new Map(a[k].map(x=>[x.id,x]));
  for(const x of b[k]||[]){const y=m.get(x.id);if(!y||x.t>y.t)m.set(x.id,x)}
  a[k]=[...m.values()];
 }
}
async function sync(){
 if(!L.link||!navigator.onLine)return setSt('○');
 if(busy)return again=1;
 busy=1;setSt('◐');
 try{
  if(!tok||Date.now()>+L.exp)await login();
  let id=L.fid;
  if(!id)id=(await(await api('drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='notes.json' and trashed=false"))).json()).files[0]?.id;
  if(!id)id=(await(await api('drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"name":"notes.json"}'})).json()).id;
  L.fid=id;
  const rs=await(await api(`drive/v3/files/${id}?alt=media`)).text();
  const R=rs?JSON.parse(rs):{f:[],n:[],t:[]};
  merge(D,R);
  const out=JSON.stringify(D);
  if(out!=JSON.stringify(R))await api('upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:out});
  L.d=JSON.stringify(D);setSt('●');draw();
 }catch(e){
  if(e==404)delete L.fid;
  if(e==401)L.exp=0;
  setSt(navigator.onLine?'!':'○');
 }
 busy=0;if(again){again=0;sync()}
}
addEventListener('online',sync);
addEventListener('offline',()=>setSt('○'));
document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&sync());
setInterval(sync,6e4);

// ---- Start ----
fi=Math.min(1,F().length-1);setTh(+L.th||0);draw();setSt(L.link?'◐':'○');sync();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
</script>
</body>
